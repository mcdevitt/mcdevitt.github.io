<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>mcdevitt — GitHub Pages File Tree</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
      --border: #e2e8f0; --accent: #059669; --accent-hover: #047857;
      --subtle: #f1f5f9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      max-width: 1020px; margin: 0 auto; padding: 2rem 1.25rem;
    }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      align-items: center; gap: 1rem; margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.45rem; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    input, select {
      padding: 0.55rem 0.8rem; border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.9rem; background: var(--card);
    }
    input { flex: 1; min-width: 240px; }
    .stack { display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.15rem;
    }
    .card-top {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      align-items: flex-start; gap: 0.75rem; padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .card h2 { font-size: 1.1rem; }
    .desc { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; }
    .meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
    .actions { display: flex; gap: 0.45rem; flex-wrap: wrap; }
    a.btn, button.btn {
      font-size: 0.78rem; font-weight: 600; padding: 0.4rem 0.7rem;
      border-radius: 7px; text-decoration: none; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
    a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    a.btn.primary:hover { background: var(--accent-hover); }

    /* File Tree Styling */
    .tree { margin-top: 0.75rem; font-size: 0.85rem; }
    .folder-group { margin-top: 0.45rem; }
    .folder-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem; font-weight: 700; color: var(--muted);
      padding: 0.25rem 0; display: flex; align-items: center; gap: 0.4rem;
    }
    .file-list {
      list-style: none; margin-left: 0.65rem; padding-left: 0.85rem;
      border-left: 1.5px solid var(--border); display: flex; flex-direction: column; gap: 0.35rem;
    }
    .file-row {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      align-items: center; gap: 0.5rem; padding: 0.35rem 0.55rem;
      border-radius: 7px; background: var(--subtle);
    }
    .file-link {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem; color: var(--text); text-decoration: none; font-weight: 600;
    }
    .file-link:hover { color: var(--accent); text-decoration: underline; }
    .file-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem; color: var(--muted); margin-left: 0.45rem;
    }
    .mini-btn {
      font-size: 0.72rem; font-weight: 600; padding: 0.22rem 0.55rem;
      border-radius: 5px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer;
    }
    .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
    #status { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>mcdevitt — Course Projects &amp; HTML File Tree</h1>
      <p class="subtitle">Auto-indexed repositories and all nested .html pages</p>
    </div>
    <a class="btn" href="https://github.com/mcdevitt" target="_blank" rel="noopener">GitHub Profile &rarr;</a>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="Search by project, folder, or .html filename..." />
    <select id="sort">
      <option value="updated">Recently Updated</option>
      <option value="name">Alphabetical (A–Z)</option>
    </select>
  </div>

  <div id="status">Scanning repositories and HTML files...</div>
  <div id="projects" class="stack"></div>

  <script>
    const USERNAME = 'mcdevitt';
    let projects = [];

    async function fetchHtmlFilesForRepo(repoName, branch) {
      const url = `https://api.github.com/repos/${USERNAME}/${repoName}/git/trees/${branch}?recursive=1`;
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      if (!Array.isArray(data.tree)) return [];

      return data.tree
        .filter(item => item.type === 'blob' && item.path.toLowerCase().endsWith('.html'))
        .map(item => {
          const parts = item.path.split('/');
          const fileName = parts.pop();
          const folder = parts.length > 0 ? parts.join('/') : '/';
          // If file is index.html at root, root URL works; otherwise append full path
          const liveUrl = item.path.toLowerCase() === 'index.html'
            ? `https://${USERNAME}.github.io/${repoName}/`
            : `https://${USERNAME}.github.io/${repoName}/${item.path}`;
          return { path: item.path, folder, fileName, liveUrl };
        })
        .sort((a, b) => a.path.localeCompare(b.path));
    }

    async function loadAllProjects() {
      let page = 1;
      let repos = [];
      while (true) {
        const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}`);
        if (!res.ok) throw new Error(`GitHub API error (${res.status})`);
        const batch = await res.json();
        repos = repos.concat(batch);
        if (batch.length < 100) break;
        page++;
      }

      const pagesRepos = repos.filter(
        r => r.has_pages && r.name.toLowerCase() !== `${USERNAME}.github.io`
      );

      // Fetch file trees in parallel (1 request per project repo)
      const enriched = await Promise.all(
        pagesRepos.map(async r => {
          const files = await fetchHtmlFilesForRepo(r.name, r.default_branch);
          return {
            name: r.name,
            description: r.description || 'No description provided.',
            rootUrl: `https://${USERNAME}.github.io/${r.name}/`,
            repoUrl: r.html_url,
            updatedAt: new Date(r.updated_at),
            files,
          };
        })
      );
      return enriched;
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text);
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = orig; }, 1200);
    }

    function render() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const sortBy = document.getElementById('sort').value;

      const filtered = projects
        .map(p => {
          const repoMatches = p.name.toLowerCase().includes(q) || p.description.toLowerCase().includes(q);
          const matchingFiles = repoMatches
            ? p.files
            : p.files.filter(f => f.path.toLowerCase().includes(q));
          return { ...p, visibleFiles: matchingFiles, keep: repoMatches || matchingFiles.length > 0 };
        })
        .filter(p => p.keep)
        .sort((a, b) => sortBy === 'name' ? a.name.localeCompare(b.name) : b.updatedAt - a.updatedAt);

      const totalFiles = filtered.reduce((acc, p) => acc + p.visibleFiles.length, 0);
      document.getElementById('status').textContent =
        `Showing ${filtered.length} projects (${totalFiles} HTML files)`;

      document.getElementById('projects').innerHTML = filtered.map(p => {
        // Group files by folder path
        const byFolder = {};
        for (const f of p.visibleFiles) {
          if (!byFolder[f.folder]) byFolder[f.folder] = [];
          byFolder[f.folder].push(f);
        }

        const folderHtml = Object.keys(byFolder).sort().map(folder => `
          <div class="folder-group">
            <div class="folder-label">&#128193; ${folder === '/' ? `${p.name}/ (root)` : `${folder}/`}</div>
            <ul class="file-list">
              ${byFolder[folder].map(f => `
                <li class="file-row">
                  <div>
                    <a class="file-link" href="${f.liveUrl}" target="_blank" rel="noopener">&#128196; ${f.fileName}</a>
                    <span class="file-url">${f.liveUrl}</span>
                  </div>
                  <button class="mini-btn" onclick="copyText(this, '${f.liveUrl}')">Copy URL</button>
                </li>
              `).join('')}
            </ul>
          </div>
        `).join('');

        return `
          <article class="card">
            <div class="card-top">
              <div>
                <h2>${p.name}</h2>
                <p class="desc">${p.description}</p>
                <div class="meta">Updated ${p.updatedAt.toLocaleDateString()} &bull; ${p.visibleFiles.length} HTML file(s)</div>
              </div>
              <div class="actions">
                <a class="btn primary" href="${p.rootUrl}" target="_blank" rel="noopener">Project Root</a>
                <a class="btn" href="${p.repoUrl}" target="_blank" rel="noopener">GitHub Repo</a>
              </div>
            </div>
            <div class="tree">
              ${p.visibleFiles.length > 0 ? folderHtml : '<div class="desc">No .html files found in default branch.</div>'}
            </div>
          </article>
        `;
      }).join('');
    }

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('sort').addEventListener('change', render);

    loadAllProjects()
      .then(data => { projects = data; render(); })
      .catch(err => { document.getElementById('status').textContent = err.message; });
  </script>
</body>
</html>
